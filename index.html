<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Em đi chơi với a nhé 💗</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />

    <style>
      body {
        margin: 0;
        background: #fffafa;
      }

      .center-screen {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }

      img {
        width: 320px;
        max-width: 85vw;
      }

      .buttones {
        width: 100%;
        text-align: center;
        margin-top: 15px;
      }

      .btn {
        display: inline-block;
        transition: 0.3s;
      }

      h1 {
        font-family: Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        margin-bottom: 20px;
        color: #222;
      }

      .top-text {
        font-size: 18px;
        margin-top: 20px;
        margin-bottom: 10px;
        color: #444;
      }

      .message {
        color: #ff3b6b;
        font-weight: 700;
        font-size: 24px;
        margin-top: 12px;
        min-height: 40px;
      }

      #nobut {
        background: #ff3b3b;
        border: none;
      }

      #yesbut {
        background: #28a745;
        border: none;
        padding: 10px 20px;
      }
    </style>
  </head>

  <body>
    <div
      id="app"
      class="center-screen"
      style="display: flex; flex-direction: column"
    >
      <p class="top-text">
        Tối thứ 7 ngày 03/10/2026
      </p>

      <h1>
        Em đi chơi với a nhé
      </h1>

      <img
        src="https://raw.githubusercontent.com/DzarelDeveloper/Img/main/Let's%20go.gif"
        alt="cute gif"
      />

      <div class="message">
        {{ currentHeaderText }}
      </div>

      <div class="buttones">
        <button
          type="button"
          class="btn btn-success mr-2"
          :style="{ fontSize: yesButtonSize + 'rem' }"
          @click="yesButton"
          id="yesbut"
        >
          Yes ❤️
        </button>

        <button
          type="button"
          class="btn btn-danger"
          @click="changeText"
          id="nobut"
        >
          No 😝
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>

    <script>
      new Vue({
        el: "#app",

        data: {
          headerText: [
            "",
            "Anh bấm nhầm đúng khônggg 🥺",
            "Suy nghĩ lại đi màaa",
            "Đi với em một hôm thôi nhaaa",
            "Chỉ có hai đứa mình thôi đó 👉👈",
            "Anh nỡ từ chối em thiệt hả 😭",
            "Đi màaaa, em năn nỉ đó",
            "Em muốn đi chơi với anh cơ 🥺",
            "Bấm Yes đi rồi em thươnggg ❤️",
            "Cơ hội cuối nhaaa 😤",
            "Không thoát được đâu =)))"
          ],

          currentHeaderTextIndex: 0,
          yesButtonSize: 1
        },

        methods: {
          changeText() {
            this.currentHeaderTextIndex =
              (this.currentHeaderTextIndex + 1) % this.headerText.length;

            this.yesButtonSize += 0.6;
          },

          yesButton() {
            window.location.href = "date.html";
          }
        },

        computed: {
          currentHeaderText() {
            return this.headerText[this.currentHeaderTextIndex];
          }
        }
      });
    </script>
  </body>
</html>
