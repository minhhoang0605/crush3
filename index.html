<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Em đi chơi với anh nhé 💗</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fffafa;
        font-family: Arial, sans-serif;
      }

      .page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      .wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 50px;
        width: 100%;
        max-width: 1200px;
      }

      .main-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .top-text {
        font-size: 18px;
        color: #555;
        margin-bottom: 10px;
      }

      h1 {
        font-size: 42px;
        font-weight: 800;
        color: #222;
        margin-bottom: 20px;
      }

      .main-card img {
        width: 320px;
        max-width: 85vw;
      }

      .message {
        color: #ff3b6b;
        font-weight: 700;
        font-size: 24px;
        margin-top: 15px;
        min-height: 40px;
      }

      .buttones {
        width: 100%;
        text-align: center;
        margin-top: 15px;
      }

      .btn {
        display: inline-block;
        transition: 0.3s;
      }

      #yesbut {
        background: #28a745;
        border: none;
        padding: 10px 20px;
      }

      #nobut {
        background: #ff3b3b;
        border: none;
      }

      .schedule-note {
        width: 330px;
        background: #fff4f7;
        border: 2px solid #ffb6c8;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 8px 25px rgba(255, 105, 135, 0.15);
      }

      .schedule-note h2 {
        text-align: center;
        color: #ff4775;
        margin-bottom: 20px;
        font-size: 27px;
      }

      .schedule-item {
        background: white;
        border-radius: 14px;
        padding: 13px 15px;
        margin-bottom: 12px;
        font-size: 17px;
        color: #333;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
      }

      .schedule-time {
        font-weight: bold;
        color: #ff4775;
      }

      .note-bottom {
        text-align: center;
        color: #777;
        margin-top: 15px;
        font-size: 15px;
      }

      @media (max-width: 850px) {
        .wrapper {
          flex-direction: column;
          gap: 25px;
        }

        .schedule-note {
          width: 90%;
          max-width: 360px;
        }

        h1 {
          font-size: 34px;
        }
      }
    </style>
  </head>

  <body>
    <div id="app" class="page">
      <div class="wrapper">

        <!-- PHẦN CHÍNH -->
        <div class="main-card">

          <p class="top-text">
            Tối thứ 7 ngày 03/10/2026
          </p>

          <h1>
            Em đi chơi với anh nhé
          </h1>

          <img
            src="https://raw.githubusercontent.com/DzarelDeveloper/Img/main/Let's%20go.gif"
            alt="cute gif"
          />

          <div class="message">
            {{ currentHeaderText }}
          </div>

          <div class="buttones">

            <button
              type="button"
              class="btn btn-success mr-2"
              :style="{ fontSize: yesButtonSize + 'rem' }"
              @click="yesButton"
              id="yesbut"
            >
              Yes ❤️
            </button>

            <button
              type="button"
              class="btn btn-danger"
              @click="changeText"
              id="nobut"
            >
              No 😝
            </button>

          </div>
        </div>

        <!-- NOTE LỊCH TRÌNH -->
        <div class="schedule-note">

          <h2>💌 Lịch trình của chúng mình</h2>

          <div class="schedule-item">
            <span class="schedule-time">20:00</span>
            — Anh qua đón em
          </div>

          <div class="schedule-item">
            <span class="schedule-time">20:15</span>
            — Đến Miss Bistro
          </div>

          <div class="schedule-item">
            <span class="schedule-time">21:30</span>
            — Xem phim ở Beta Tây Sơn
          </div>

          <div class="schedule-item">
            <span class="schedule-time">00:00</span>
            — Anh đưa em về nhà
          </div>

          <div class="note-bottom">
            Em chỉ cần đồng ý thôi, còn lại để anh lo 🤍
          </div>

        </div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>

    <script>
      new Vue({
        el: "#app",

        data: {
          headerText: [
            "",
            "Em bấm nhầm đúng khônggg 🥺",
            "Suy nghĩ lại đi màaa",
            "Đi với anh một hôm thôi nhaaa",
            "Chỉ có hai đứa mình thôi đó 👉👈",
            "Em nỡ từ chối anh thiệt hả 😭",
            "Đi màaaa, anh năn nỉ đó",
            "Anh muốn đi chơi với em cơ 🥺",
            "Bấm Yes đi rồi anh thươnggg ❤️",
            "Cơ hội cuối nhaaa 😤",
            "Không thoát được đâu =)))"
          ],

          currentHeaderTextIndex: 0,
          yesButtonSize: 1
        },

        methods: {
          changeText() {
            this.currentHeaderTextIndex =
              (this.currentHeaderTextIndex + 1) %
              this.headerText.length;

            this.yesButtonSize += 0.6;
          },

          yesButton() {
            window.location.href = "date.html";
          }
        },

        computed: {
          currentHeaderText() {
            return this.headerText[this.currentHeaderTextIndex];
          }
        }
      });
    </script>

  </body>
</html>
