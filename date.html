<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chốt kèo nhaaa 💗</title>

    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #fffafa;
        overflow-x: hidden;
        font-family: Arial, sans-serif;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 25px;
      }

      .gif_container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
      }

      .gif_container img {
        width: 320px;
        max-width: 85vw;
        border-radius: 15px;
      }

      .header_text {
        font-size: 38px;
        font-weight: bold;
        text-align: center;
        margin-top: 25px;
        margin-bottom: 10px;
        color: #ff3b6b;
        text-shadow: 0 0 5px white;
      }

      .beauty-text {
        font-size: 25px;
        font-weight: bold;
        color: #ff6b91;
        margin-top: 10px;
      }

      .sub-text {
        font-size: 18px;
        color: #666;
        margin-top: 10px;
      }

      @media (max-width: 600px) {
        .header_text {
          font-size: 30px;
        }

        .beauty-text {
          font-size: 22px;
        }
      }
    </style>
  </head>

  <body>

    <div class="container">

      <div class="gif_container">

        <img
          src="https://raw.githubusercontent.com/DzarelDeveloper/Img/main/hihi%20makasih.gif"
          alt="cute gif"
        />

        <img
          src="https://raw.githubusercontent.com/DzarelDeveloper/Img/main/MoviesDate.jpg"
          alt="Movies Date"
        />

      </div>

      <h3 class="header_text">
        Okeee chốt kèo nhaaa 💗
        Tối thứ 7 anh qua đón em nhéee :333
      </h3>

      <div class="beauty-text">
        Việc của em là xinh đẹp ✨
      </div>

      <div class="sub-text">
        Còn lịch trình cứ để anh lo 🤍
      </div>

    </div>

  </body>
</html>
